name: Verify Evidence Locker

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
      - name: Install pinned runtime
        run: python -m pip install -r requirements.txt
      - name: Confirm OpenCV 5
        run: python -c "import cv2; assert cv2.__version__ == '5.0.0'; print(cv2.__version__)"
      - name: Run all tests
        run: python -m unittest -v
      - name: Run seeded evaluation
        run: python evaluate_synthetic.py
      - name: Rebuild judge endpoint
        run: |
          python build_static_demo.py --output-dir /tmp/evidence-locker-site
          diff -u docs/index.html /tmp/evidence-locker-site/index.html
          diff -u docs/evidence.json /tmp/evidence-locker-site/evidence.json
          cmp docs/evidence-frame-000001.png /tmp/evidence-locker-site/evidence-frame-000001.png
