<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Agentic Vision Evidence Locker architecture</title>
  <desc id="desc">A future API Gateway upload route feeds an S3 input bucket. An implemented Lambda OpenCV 5 container produces evidence cards, overlays, a bounded plan, and a fail-closed explanation. It writes encrypted reports to S3 and logs to CloudWatch. A human reviews the standalone page.</desc>
  <defs>
    <style>
      .bg{fill:#0b1020}.box{fill:#151d33;stroke:#6487c9;stroke-width:2}.done{stroke:#52d3a5}.future{stroke:#f4b942;stroke-dasharray:10 8}.human{stroke:#d09cff}.title{fill:#f4f7ff;font:700 30px system-ui}.label{fill:#f4f7ff;font:700 20px system-ui}.copy{fill:#b9c7e5;font:15px system-ui}.small{fill:#91a4cc;font:13px system-ui}.arrow{stroke:#91a4cc;stroke-width:3;fill:none;marker-end:url(#head)}
    </style>
    <marker id="head" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#91a4cc"/></marker>
  </defs>
  <rect class="bg" width="1200" height="620"/>
  <text class="title" x="60" y="60">Agentic Vision Evidence Locker</text>
  <text class="small" x="60" y="88">Solid green = implemented and locally tested · dashed gold = future AWS wiring</text>

  <rect class="box future" x="55" y="145" rx="14" width="190" height="110"/>
  <text class="label" x="82" y="187">API Gateway</text><text class="copy" x="82" y="216">job + upload URL</text>
  <rect class="box future" x="295" y="145" rx="14" width="190" height="110"/>
  <text class="label" x="330" y="187">S3 input</text><text class="copy" x="330" y="216">video object event</text>
  <path class="arrow" d="M245 200H295"/><path class="arrow" d="M485 200H535"/>

  <rect class="box done" x="535" y="120" rx="14" width="310" height="165"/>
  <text class="label" x="570" y="158">Lambda arm64 container</text>
  <text class="copy" x="570" y="190">OpenCV 5 extraction + hysteresis</text>
  <text class="copy" x="570" y="218">bounded plan + cited explanation</text>
  <text class="copy" x="570" y="246">dual SHA-256 receipts</text>

  <rect class="box future" x="915" y="120" rx="14" width="220" height="110"/>
  <text class="label" x="960" y="160">CloudWatch</text><text class="copy" x="947" y="190">job + failure logs</text>
  <path class="arrow" d="M845 170H915"/>

  <rect class="box done" x="535" y="360" rx="14" width="310" height="145"/>
  <text class="label" x="592" y="400">S3 evidence output</text>
  <text class="copy" x="582" y="432">AES-256 JSON + overlay hashes</text>
  <text class="copy" x="585" y="460">recursion-safe reports/ prefix</text>
  <path class="arrow" d="M690 285V360"/>

  <rect class="box done human" x="915" y="360" rx="14" width="220" height="145"/>
  <text class="label" x="970" y="402">Human review</text>
  <text class="copy" x="954" y="434">escaped standalone HTML</text>
  <text class="copy" x="958" y="462">approve · rerun · stop</text>
  <path class="arrow" d="M845 432H915"/>

  <text class="small" x="55" y="575">No AWS account, billing, deployment, API Gateway, S3 bucket, CloudWatch group, registration, or submission exists yet.</text>
</svg>
